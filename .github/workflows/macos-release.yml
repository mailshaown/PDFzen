name: Build macOS installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_VERSION: "0.1.0"
  RELEASE_TAG: "v0.1.0"

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build DMG
        run: npm run tauri -- build --target "${{ matrix.target }}" --bundles dmg

      - name: Rename DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find "$CARGO_TARGET_DIR" -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "PDFzen_${APP_VERSION}_${{ matrix.arch }}.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: PDFzen_${{ env.APP_VERSION }}_${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    name: Publish DMGs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          merge-multiple: true
          path: artifacts

      - name: Attach DMGs to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          shasum -a 256 *.dmg > SHA256SUMS-macos.txt
          gh release upload "$RELEASE_TAG" *.dmg SHA256SUMS-macos.txt --clobber --repo "$GITHUB_REPOSITORY"
